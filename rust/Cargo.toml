[workspace]
resolver = "2"
members = [
    "crates/mhn-domain",
    "crates/mhn-engine",
    "crates/mhn-service",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mhn-domain = { path = "crates/mhn-domain" }
mhn-engine = { path = "crates/mhn-engine" }
